name: Kida Backend V1 Checks

on:
  push:
    branches:
      - "backend-v1/customer-data"
    paths:
      - "src/**"
      - "migrations/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".grok/app-env.json"
      - ".github/workflows/kida-backend-v1.yml"
  pull_request:
    branches:
      - "client-approval/customer-app"
    paths:
      - "src/**"
      - "migrations/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".grok/app-env.json"
      - ".github/workflows/kida-backend-v1.yml"

permissions:
  contents: write

jobs:
  quality:
    name: Test, typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Kida
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate the npm lockfile if the existing manifest is out of sync
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile repair when needed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize npm lockfile for Backend V1"
            git push
          fi

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit and database migration tests
        run: npm test

      - name: Build production app (generates TanStack route types)
        run: npm run build

      - name: Commit generated TanStack route tree when it changes
        run: |
          if ! git diff --quiet -- src/routeTree.gen.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/routeTree.gen.ts
            git commit -m "chore: regenerate TanStack route tree for Backend V1"
            git push
          fi

      - name: Typecheck generated application routes and server code
        run: npm run typecheck
